name: Sincronização Diária de Proventos Provisionados

on:
  schedule:
    # 22:05 UTC equivale a 19:05 no Horário de Brasília (BRT)
    - cron: '5 22 * * *'
  workflow_dispatch:
    # Permite rodar manualmente clicando no botão "Run workflow" na aba Actions

jobs:
  sync_dividends:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Repositório
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Ou a versão que você usa
        cache: 'pip'

    - name: Instalar Dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Garantindo a instalação do curl_cffi que é crucial
        pip install curl_cffi

    - name: Executar Sincronizador
      env:
        # A variável de ambiente DATABASE_URL deve ser configurada nos Secrets do repositório
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        python sync_job.py
